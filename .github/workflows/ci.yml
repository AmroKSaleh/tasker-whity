name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    container: php:8.4-cli
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned whity-core (for the SDK path repository)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq && apt-get install -y -qq git unzip
          git clone https://github.com/AmroKSaleh/whity-core.git host/.core
          git -C host/.core checkout "$(cat host/core.version)"

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Install plugin dependencies
        working-directory: plugin
        run: composer install --no-interaction --no-progress

      - name: PHPUnit
        working-directory: plugin
        run: php vendor/bin/phpunit

      - name: PHPStan
        working-directory: plugin
        run: php vendor/bin/phpstan analyse

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Vitest
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned whity-core (the admin source lives here)
        run: |
          git clone https://github.com/AmroKSaleh/whity-core.git host/.core
          git -C host/.core checkout "$(cat host/core.version)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: host/.core/web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: host/.core/web
        run: npm run build
