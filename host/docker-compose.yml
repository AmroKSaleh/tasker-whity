name: tasker

services:
  postgres:
    image: postgres:15
    container_name: tasker_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tasker}
      POSTGRES_USER: ${DB_USER:-tasker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tasker_dev}
    ports:
      - "5433:5432"
    volumes:
      - tasker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tasker} -d ${DB_NAME:-tasker}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Dev-only one-shot bootstrap. The frankenphp service below bind-mounts
  # ./.core over /app, which hides whatever vendor/ the image build produced
  # (Dockerfile's `release` stage bakes vendor/ in, but that copy lives only
  # inside the image layer, not on the host checkout the bind mount exposes).
  # It also means the FrankenPHP persistent worker would otherwise boot
  # straight into `public/index.php`, which queries app_settings before
  # serving any request — and fails to ever reach frankenphp_handle_request()
  # if migrations haven't run yet. This service installs composer
  # dependencies against the MOUNTED checkout, then migrates and seeds,
  # before frankenphp is allowed to start (see its `depends_on` below).
  # Mirrors whity-core's own db-init pattern (host/.core/docker-compose.yml).
  bootstrap:
    build:
      context: ./.core
      dockerfile: Dockerfile
      # Deliberately NOT `target: base`, unlike frankenphp below. whity-core's
      # own dev workflow (docs/wiki/Sprint-1-Setup.md) assumes the developer
      # already ran `composer install` with a host-native PHP/Composer
      # toolchain before Docker ever gets involved — that's why whity-core's
      # own db-init service can get away with `target: base`, which has no
      # composer/git/unzip. This machine (and a fresh clone in general) has
      # no host PHP/Composer, so this service instead uses the `release`
      # stage purely for its baked-in composer + git + unzip binaries, to run
      # `composer install` AGAINST THE BIND-MOUNTED CHECKOUT below. The code
      # `release` COPYs into the image is irrelevant and gets hidden by that
      # same bind mount — only the tool binaries matter here. Tagged
      # separately (`tasker-core:bootstrap`) from the runtime image so the
      # two build targets never fight over one image tag.
      target: release
    image: tasker-core:bootstrap
    container_name: tasker_bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./.core:/app
      # Tasker's own dev-convenience script (Task 5, Finding 3) — NOT part of
      # vendored core. Flips the per-tenant mcp.enabled setting so a clean
      # clone reaches a working MCP surface via `npm run host:up` alone. Must
      # run in-process here (not over HTTP): frankenphp isn't started yet at
      # this point in the lifecycle (see its `depends_on: bootstrap:
      # condition: service_completed_successfully` below), so the documented
      # PATCH /api/v1/settings call has nothing to reach. See the script's
      # own header comment for the full rationale.
      - ./scripts/enable-tenant-mcp.php:/tmp/enable-tenant-mcp.php:ro
    working_dir: /app
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        echo "[bootstrap] installing composer dependencies against the mounted checkout...";
        composer install --no-progress --no-interaction;
        echo "[bootstrap] running migrations...";
        php public/index.php migrate run;
        echo "[bootstrap] seeding database...";
        php public/index.php seed;
        echo "[bootstrap] enabling MCP for the default tenant (dev convenience; see README's 'Enabling MCP' section)...";
        php /tmp/enable-tenant-mcp.php || echo "[bootstrap] WARNING: could not enable mcp.enabled automatically -- fall back to the manual PATCH /api/v1/settings steps in README.md.";
        echo "[bootstrap] done.";

  frankenphp:
    build:
      context: ./.core
      dockerfile: Dockerfile
      # Matches whity-core's own dev/staging convention exactly (see
      # host/.core/Dockerfile's stage comments, and the frankenphp/db-init
      # services in host/.core/docker-compose.yml): the runtime container
      # ships no code of its own — the bind mount below supplies /app,
      # including vendor/ (installed by the bootstrap service above, against
      # this same checkout). Building `release` here would be pure waste:
      # composer/git/unzip and a baked vendor/ snapshot that the bind mount
      # immediately hides anyway.
      target: base
    image: tasker-core:dev
    container_name: tasker_frankenphp
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Verified against whity-core's own compose file: the container
      # listens on :80, the Caddyfile lives at /etc/frankenphp/Caddyfile,
      # and these four variables are consumed by that Caddyfile.
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      SERVER_NAME: ":80"
      SERVER_ROOT: "public/"
      FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-4}
      FRANKENPHP_TIMEOUT: ${FRANKENPHP_TIMEOUT:-60s}
    ports:
      - "8010:80"
    volumes:
      - ./.core:/app
      - ./Caddyfile:/etc/frankenphp/Caddyfile
      - ../app/dist:/app/public/spa

volumes:
  tasker_pgdata:
